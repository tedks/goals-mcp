name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check release version and reviewed branch
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          git merge-base --is-ancestor HEAD origin/master
          node -e 'const p = require("./package.json"); if (!/^\d+\.\d+\.\d+$/.test(p.version) || process.env.GITHUB_REF_NAME !== `v${p.version}`) process.exit(1)'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: node tests/package.cjs
      - name: Pack and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack --ignore-scripts --json > pack.json
          archive=$(node -p 'require("./pack.json")[0].filename')
          sha256sum "$archive" > SHA256SUMS
          node -e 'const fs = require("node:fs"); const notes = fs.readFileSync("CHANGELOG.md", "utf8").split(/^## /m)[1]; if (!notes) process.exit(1); fs.writeFileSync("release-notes.md", "## " + notes)'
          gh release create "$GITHUB_REF_NAME" "$archive" SHA256SUMS \
            --draft --verify-tag --title "Goals MCP $GITHUB_REF_NAME" --notes-file release-notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false
